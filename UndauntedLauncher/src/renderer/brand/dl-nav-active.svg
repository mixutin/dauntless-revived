  <path d="M0 9 H190 M0 15 H160 M20 22 H205 M0 30 H175 M40 37 H198 M0 42 H150" fill="none" stroke="#7fbdf0" stroke-opacity="0.16" stroke-width="1.2"/>
  <path d="M10 12 H120 M30 26 H140 M5 34 H110" fill="none" stroke="#0c3a66" stroke-opacity="0.35" stroke-width="1"/>
