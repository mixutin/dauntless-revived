  </defs>
  <!-- A brush stroke of paint: straight on the left, torn and ragged where the brush lifted on the right. -->
  <path d="M0 2 L204 1 L212 4 L207 7 L221 9 L214 13 L230 16 L219 20 L236 24 L222 28 L232 32 L216 35 L226 39 L208 42 L215 46 L196 48 L0 48 Z" fill="#0b2744"/>
